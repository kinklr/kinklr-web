name: Sync Fork
on:
  push:
    branches: [main]

jobs:
  sync:
    if: github.repository_owner == 'kinklr'
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        run: |
          gh api --method POST \
            /repos/ConnorK328/kinklr-web/merge-upstream \
            -f branch=main
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}